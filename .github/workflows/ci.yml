name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make lint
      - run: make test
      - name: Timed whole-repository run (budget 30 s)
        run: |
          start=$(date +%s)
          make run
          elapsed=$(( $(date +%s) - start ))
          echo "make run took ${elapsed}s"
          if [ "$elapsed" -gt 30 ]; then echo "over the 30 s budget"; exit 1; fi
